<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#eef0f2" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="%sveltekit.assets%/logo.png" type="image/png" />
		<!-- PWA instalable: solo el manifiesto, sin service worker (la app necesita conexión). -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/iconos/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
