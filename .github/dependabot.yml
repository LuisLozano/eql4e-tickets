# RNF-17: dependencias al día. Agrupadas para no generar un PR por paquete.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # Los tipos siguen a la versión de Node que usamos (24), no a la última.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # postgres.js 4 reescribió el driver (oct. 2026): esperar a que Drizzle lo dé por soportado.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
    groups:
      desarrollo:
        dependency-type: development
        update-types: [minor, patch]
      produccion:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # El salto de versión mayor de Node (y de PostgreSQL) se decide a mano.
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: postgres
        update-types: [version-update:semver-major]
    commit-message:
      prefix: 'chore(docker)'
