# Integración continua (ADR-0007): calidad en cada push y PR; imagen a GHCR en main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: eql4e
          POSTGRES_PASSWORD: eql4e
          POSTGRES_DB: eql4e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eql4e" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://eql4e:eql4e@127.0.0.1:5432/eql4e
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Formato y lint
        run: pnpm lint
      - name: Tipos
        run: pnpm check
      - name: Pruebas unitarias con cobertura
        run: pnpm test:cobertura
      - name: Pruebas de integración (Testcontainers)
        run: pnpm test:integracion
      - name: Compilación
        run: pnpm build
      - name: Navegadores de Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Pruebas e2e (móvil y escritorio)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: informe-playwright
          path: playwright-report
          retention-days: 7

  auditoria:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm audit --prod --audit-level high

  imagen:
    name: Imagen Docker en GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [calidad, auditoria]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/luislozano/eql4e-tickets
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
