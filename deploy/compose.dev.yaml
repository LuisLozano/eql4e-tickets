# PostgreSQL de desarrollo y pruebas de integración en local (ADR-0006).
# Uso: sudo docker compose -f deploy/compose.dev.yaml up -d
name: eql4e-dev

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eql4e
      POSTGRES_PASSWORD: eql4e
      POSTGRES_DB: eql4e
    ports:
      - 127.0.0.1:5436:5432
    volumes:
      - pgdata-dev:/var/lib/postgresql

volumes:
  pgdata-dev:
    name: eql4e_dev_pgdata
